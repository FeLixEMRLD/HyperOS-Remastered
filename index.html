<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperOS Remastered</title>
    <style>
        /* Color System & CSS Variables */
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-sub: #222222;
            --nav-links-color: #000000;
            --btn-get-started-bg: transparent;
            --btn-get-started-border: #000000;
            --btn-get-started-text: #000000;
            --btn-changelogs-bg: #000000;
            --btn-changelogs-text: #ffffff;
            --icon-color: #000000;
            
            /* Device Card Theme Variables */
            --card-border: #333333;
            --card-divider: #333333;
            --card-bg: transparent;
            --badge-text: #555555;
        }

        [data-theme="dark"] {
            --bg-color: #0a0a0c;
            --text-main: #ffffff;
            --text-sub: #e4e4e7;
            --nav-links-color: #ffffff;
            --btn-get-started-bg: transparent;
            --btn-get-started-border: #ffffff;
            --btn-get-started-text: #ffffff;
            --btn-changelogs-bg: #ffffff;
            --btn-changelogs-text: #000000;
            --icon-color: #ffffff;
            
            /* Dark Mode Device Card Alterations */
            --card-border: #444446;
            --card-divider: #444446;
            --badge-text: #a1a1aa;
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        html {
            scroll-behavior: smooth; /* Enables smooth jumping when clicking links */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Top Bar Layout */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            z-index: 10;
        }

        .logo-area {
            width: 100%;
            max-width: 480px;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            border: 2px dashed rgba(128, 128, 128, 0.2);
            border-radius: 8px;
        }

        .logo-placeholder-text {
            font-size: 0.9rem;
            color: rgba(128, 128, 128, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Navigation Menu Structure */
        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .nav-links li {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            color: var(--nav-links-color);
            text-decoration: none;
            text-transform: uppercase;
            padding: 0 10px;
            transition: opacity 0.2s ease;
        }

        .nav-links a:hover {
            opacity: 0.6;
        }

        .separator {
            color: rgba(128, 128, 128, 0.4);
            font-weight: 300;
            user-select: none;
        }

        /* Theme Toggle Button Icon Settings */
        .theme-toggle-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            color: var(--icon-color);
            margin-left: 10px;
        }

        .theme-toggle-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .theme-toggle-btn:hover svg {
            transform: scale(1.1);
        }

        .sun-icon { display: none; }
        .moon-icon { display: block; }

        [data-theme="dark"] .sun-icon { display: block; }
        [data-theme="dark"] .moon-icon { display: none; }

        /* Main Section Container Scroll Wrapper */
        .content-sections {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hero Landing Screen Section */
        .hero-view {
            width: 100%;
            max-width: 800px;
            min-height: calc(100vh - 250px);
            padding: 80px 24px 100px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .hero-desc {
            font-size: 1.2rem;
            line-height: 1.5;
            color: var(--text-sub);
            max-width: 700px;
            margin-bottom: 40px;
        }

        .action-container {
            display: flex;
            gap: 25px;
        }

        .btn {
            font-size: 1.1rem;
            font-weight: 400;
            padding: 12px 48px;
            border-radius: 30px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-get-started {
            background-color: var(--btn-get-started-bg);
            border: 2.5px solid var(--btn-get-started-border);
            color: var(--btn-get-started-text);
        }

        .btn-changelogs {
            background-color: var(--btn-changelogs-bg);
            border: 2.5px solid var(--btn-changelogs-bg);
            color: var(--btn-changelogs-text);
        }

        .btn:hover {
            transform: scale(1.04);
            opacity: 0.95;
        }

        .devices-view {
            width: 100%;
            max-width: 1200px;
            padding: 6
